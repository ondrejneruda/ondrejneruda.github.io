<!doctype html>
<!-- Source for assets/og-image.png, the preview image shown when the link is shared.
     Regenerate with tools/make-og-image.sh after changing this file. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;800&display=swap">
<link rel="stylesheet" href="../assets/css/tokens.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  /* Centred layout, so apps that crop the preview to a square still show the face. */
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  /* Head-and-shoulders crop of the 32×64 sprite: rows 4–20, columns 4–28, 22× scale. */
  .portrait {
    --px: 22px;
    width: calc(24 * var(--px));
    height: calc(16 * var(--px));
    overflow: hidden;
  }
  .portrait img {
    width: calc(32 * var(--px)); height: calc(64 * var(--px));
    margin: calc(-4 * var(--px)) 0 0 calc(-4 * var(--px));
    image-rendering: pixelated; display: block;
  }
  h1 { margin: 24px 0 0; font-size: 64px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
  .url { margin: 18px 0 0; font-size: 24px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="portrait"><img src="../assets/img/hero.png" alt=""></div>
  <h1>Ondřej Neruda</h1>
  <p class="url">ondrejneruda.github.io</p>
</body>
</html>
